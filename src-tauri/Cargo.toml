[package]
name = "authenticator"
version = "1.0.0-pre.15"
description = "Encrypted cross-platform TOTP authenticator"
authors = ["local"]
edition = "2021"

[lib]
name = "authenticator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
hex = "0.4"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rqrr = "0.7"
percent-encoding = "2"
dirs = "6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zeroize = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.2"

[dev-dependencies]
tempfile = "3"
