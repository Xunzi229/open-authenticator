<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>验证器</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="titlebar-drag" data-tauri-drag-region>
      <span class="titlebar-mark">验</span>
      <span class="titlebar-name">验证器</span>
    </div>
    <div class="win-btns">
      <button type="button" id="win-min" title="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" id="win-max" title="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.4" y="1.4" width="7.2" height="7.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" id="win-close" title="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </header>
  <section id="gate" class="screen">
    <div class="card">
      <div class="logo-mark">验</div>
      <div class="logo">验证器</div>
      <p class="sub" id="gate-sub">主密码解锁</p>
      <form id="gate-form">
        <label class="setup-only">新主密码
          <input id="pw1" type="password" autocomplete="new-password" spellcheck="false" />
        </label>
        <label id="pw2-wrap">确认密码 / 主密码
          <input id="pw2" type="password" autocomplete="current-password" spellcheck="false" />
        </label>
        <p class="err" id="gate-err"></p>
        <button type="submit" id="gate-btn">解锁</button>
        <button type="button" id="btn-bio" class="ghost hidden">指纹解锁</button>
      </form>
    </div>
  </section>
  <section id="app" class="screen hidden">
    <header class="head">
      <div class="title">
        <h1>验证码</h1>
        <p>点验证码显示 · 点右侧复制</p>
      </div>
      <div class="head-right">
        <div class="ring" id="ring">
          <svg viewBox="0 0 36 36">
            <circle class="track" cx="18" cy="18" r="15.5"></circle>
            <circle class="prog" cx="18" cy="18" r="15.5"></circle>
          </svg>
          <span class="num" id="remain">--</span>
        </div>
        <button type="button" class="icon-btn" id="btn-lock" title="锁定">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
      </div>
    </header>
    <div class="toolbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="q" type="search" placeholder="搜索" />
      </div>
      <button type="button" class="icon-btn" id="btn-add" title="添加">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-io" title="导入导出">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-set" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="list" id="list"></div>
  </section>
  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="prompt" class="modal front hidden"><div class="sheet" id="prompt-sheet"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
