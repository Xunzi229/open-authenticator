plugins { id 'com.android.application' }

android {
    namespace 'app.openauthenticator.android'
    compileSdk 35
    defaultConfig {
        applicationId 'app.openauthenticator.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        stableDebug {
            def keystorePath = System.getenv('ANDROID_DEBUG_KEYSTORE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_DEBUG_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_DEBUG_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_DEBUG_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('ANDROID_DEBUG_KEYSTORE')) signingConfig signingConfigs.stableDebug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.google.protobuf:protobuf-java:3.25.5'
}
