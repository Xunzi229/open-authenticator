name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: npm ci
      - run: npm run check:version
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together'
          }
          if (-not $hasCertificate) {
            Write-Host 'Unsigned Windows release: signing certificate is not configured'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'authenticator-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Compress -Depth 5
          "TAURI_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Apple signing
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing_values=0
          [[ -n "$APPLE_CERTIFICATE" ]] && signing_values=$((signing_values + 1))
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] && signing_values=$((signing_values + 1))
          [[ -n "$APPLE_SIGNING_IDENTITY" ]] && signing_values=$((signing_values + 1))
          if [[ "$signing_values" -ne 0 && "$signing_values" -ne 3 ]]; then
            echo 'APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY must be configured together' >&2
            exit 1
          fi
          if { [[ -n "$APPLE_ID" ]] || [[ -n "$APPLE_PASSWORD" ]] || [[ -n "$APPLE_TEAM_ID" ]]; } && \
             { [[ -z "$APPLE_ID" ]] || [[ -z "$APPLE_PASSWORD" ]] || [[ -z "$APPLE_TEAM_ID" ]]; }; then
            echo 'APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID must be configured together' >&2
            exit 1
          fi
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'Ad-hoc signed macOS release: Apple signing secrets are not configured'
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [[ -z "$value" ]] && continue
            delimiter="EOF_${name}_${RANDOM}"
            {
              echo "${name}<<${delimiter}"
              echo "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Authenticator ${{ github.ref_name }}"
          releaseBody: "跨平台验证器"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      - name: Windows portable
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = "src-tauri/target/release/authenticator.exe"
          if (-not (Test-Path $exe)) { $exe = "src-tauri/target/release/Authenticator.exe" }
          if (-not (Test-Path $exe)) { throw "portable exe not found" }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item $exe portable/Authenticator.exe -Force
          $zip = "Authenticator_$($env:VERSION)_windows_x64_portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path portable/Authenticator.exe -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber
