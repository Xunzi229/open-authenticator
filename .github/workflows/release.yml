name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri icon src-tauri/icons/icon.png

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Authenticator ${{ github.ref_name }}"
          releaseBody: "跨平台验证器"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      - name: Windows portable
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = "src-tauri/target/release/authenticator.exe"
          if (-not (Test-Path $exe)) { $exe = "src-tauri/target/release/Authenticator.exe" }
          if (-not (Test-Path $exe)) { throw "portable exe not found" }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item $exe portable/Authenticator.exe -Force
          $zip = "Authenticator_$($env:VERSION)_windows_x64_portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path portable/Authenticator.exe -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber
